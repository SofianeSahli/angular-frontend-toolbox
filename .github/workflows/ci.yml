# spec 001 (REQ-6.1 – REQ-6.5): lint, test and build the affected projects on
# every pull request to main and every push to main; the e2e smoke test runs on
# main only. No secrets and no backend are used.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so nx affected can compare against main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sets NX_BASE / NX_HEAD: the PR base, or the last successful run on main.
      - uses: nrwl/nx-set-shas@v5

      - name: Lint, test and build (affected)
        run: npx nx affected -t lint test build

      - name: Install Chromium for Playwright
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        if: github.event_name == 'push'
        run: npx nx e2e expenses-management-e2e

      - name: Upload Playwright report and traces
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 14
