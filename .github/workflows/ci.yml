# spec 001 (REQ-6.1 – REQ-6.5), spec 002: lint, test and build the affected
# projects on every pull request to main and every push to main. The e2e smoke
# test was removed with the old app (spec 002, REQ-8.2); a new one comes with
# the first real screen. No secrets and no backend are used.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so nx affected can compare against main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sets NX_BASE / NX_HEAD: the PR base, or the last successful run on main.
      - uses: nrwl/nx-set-shas@v5

      - name: Lint, test, build and check themes (affected)
        run: npx nx affected -t lint test build check-tokens
