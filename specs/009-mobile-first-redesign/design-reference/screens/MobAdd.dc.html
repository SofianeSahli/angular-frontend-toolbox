<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ajouter une dépense — montant d'abord</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/23d1d29ff2fce2123df00f4c614b0bfe">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#1D4E89}a:hover{color:#163d6c}
</style>
</helmet>
<div class="o-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column; font-family: Inter, sans-serif; color: #1C1A17">
<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 12px">

<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #D9D1C4; align-self: center"></div>
<header style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<h1 style="margin: 0; font-size: 17px; font-weight: 600">{{title}}</h1>
<a href="Main.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; color: #6B6358"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</header>
<div role="radiogroup" aria-label="Fréquence" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #F3EEE6">
<button type="button" role="radio" aria-checked="{{onceChecked}}" onClick="{{ setOnce }}" style="{{onceStyle}}">Une seule fois</button>
<button type="button" role="radio" aria-checked="{{recChecked}}" onClick="{{ setRec }}" style="{{recStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"></path><path d="M4 11V9a4 4 0 0 1 4-4h12"></path><path d="M7 22l-3-3 3-3"></path><path d="M20 13v2a4 4 0 0 1-4 4H4"></path></svg>Récurrente</button>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 0">
<output aria-live="polite" aria-label="Montant" class="num" style="font-size: 44px; line-height: 52px; font-weight: 600; letter-spacing: -0.02em; color: {{amountColor}}">{{display}}<span style="font-size: 22px; font-weight: 500; margin-left: 6px; color: #6B6358">DT</span></output>
<span class="ui-small" style="color: #6B6358">Dépenses du foyer · Aujourd'hui</span>
</div>

<div role="group" aria-label="Reprendre une opération récente" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{templates}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{ t.use }}" style="flex: none; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px dashed #C9C1B4; background: #FBF8F3; color: #1C1A17; font: 500 13px Inter, sans-serif; white-space: nowrap; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>

<div role="radiogroup" aria-label="Catégorie" style="display: flex; flex-direction: column; gap: 6px">
<span class="ui-small" style="color: #6B6358">Catégorie</span>
<div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{c.checked}}" onClick="{{ c.pick }}" style="{{c.style}}">{{c.label}}<sc-if value="{{ c.sug }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 500; opacity: 0.85">· suggérée</span></sc-if></button>
</sc-for>
</div>
</div>

<sc-if value="{{ isOnce }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #1D4E89; background: #EAF0F7; color: #1D4E89; font: 500 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Aujourd'hui</button>
<button type="button" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #E7E0D5; background: #FFFFFF; color: #1C1A17; font: 500 13px Inter, sans-serif">Hier</button>
<button type="button" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #E7E0D5; background: #FFFFFF; color: #1C1A17; font: 500 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19h4L19 9l-4-4L5 15z"></path></svg>Note</button>
</div>
</sc-if>
<sc-if value="{{ isRec }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" aria-haspopup="dialog" style="min-height: 40px; padding: 0 12px; border-radius: 999px; font: 500 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px; border: 1px solid #1D4E89; background: #EAF0F7; color: #1D4E89">Chaque mois<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" aria-haspopup="dialog" style="min-height: 40px; padding: 0 12px; border-radius: 999px; font: 500 13px Inter, sans-serif; display: flex; align-items: center; gap: 6px; border: 1px solid #E7E0D5; background: #FFFFFF; color: #1C1A17">Dès aujourd'hui · sans fin</button>
</div>
</sc-if>

<button type="button" style="min-height: 52px; border: 0; border-radius: 12px; background: {{saveBg}}; color: {{saveFg}}; font: 600 16px Inter, sans-serif; cursor: pointer">{{saveLabel}}</button>
</div>

<div role="group" aria-label="Pavé numérique" style="margin-top: auto; padding: 8px 8px 24px; background: #F3EEE6; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" aria-label="{{k.aria}}" onClick="{{ k.press }}" style="height: 52px; border: 0; border-radius: 10px; background: #FFFFFF; color: #1C1A17; font: 500 22px Inter, sans-serif; box-shadow: 0 1px 0 rgba(28,26,23,0.08); cursor: pointer">{{k.label}}</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["once","recurring"],"default":"once"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { amount: '', cat: 'ali', mode: props.mode === 'recurring' ? 'recurring' : 'once' };
}
press(key) {
var a = this.state.amount;
if (key === 'del') { a = a.slice(0, -1); }
else if (key === ',') { if (a.indexOf(',') === -1) { a = (a === '' ? '0' : a) + ','; } }
else {
var parts = a.split(',');
if (parts.length === 2 && parts[1].length >= 3) { return; }
if (parts.length === 1 && parts[0].length >= 6) { return; }
a = (a === '0' ? '' : a) + key;
}
this.setState({ amount: a });
}
renderVals() {
var self = this;
var a = this.state.amount;
var whole = a.split(',')[0] || '0';
whole = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
var dec = a.indexOf(',') === -1 ? '' : ',' + a.split(',')[1];
var display = whole + dec;
var rec = this.state.mode === 'recurring';
var segOff = 'min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #1C1A17; font: 500 14px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; ';
var segOn = 'background: #FFFFFF; font-weight: 600; box-shadow: 0 1px 2px rgba(28,26,23,0.12)';
var hasAmount = a !== '' && a.replace(/[0,]/g, '') !== '';
var catList = [
{ code: 'ali', label: 'Alimentation', sug: true },
{ code: 'caf', label: 'Cafés & resto', sug: false },
{ code: 'tra', label: 'Transport', sug: false },
{ code: 'oth', label: 'Autre catégorie…', sug: false }
];
var cats = catList.map(function (c) {
var on = self.state.cat === c.code;
return {
label: c.label, sug: c.sug && on, checked: on ? 'true' : 'false',
style: 'flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; font: 500 14px Inter, sans-serif; white-space: nowrap; display: flex; align-items: center; gap: 6px; cursor: pointer; ' + (on ? 'border: 1px solid #4E6B1F; background: #4E6B1F; color: #FFFFFF' : 'border: 1px solid #E7E0D5; background: #FFFFFF; color: #1C1A17'),
pick: function () { self.setState({ cat: c.code }); }
};
});
var tpl = [
{ label: 'Boulangerie 1,500', amount: '1,5', cat: 'ali' },
{ label: 'Taxi 12', amount: '12', cat: 'tra' },
{ label: 'Café 3,500', amount: '3,5', cat: 'caf' }
];
var templates = tpl.map(function (t) { return { label: t.label, use: function () { self.setState({ amount: t.amount, cat: t.cat }); } }; });
var keyList = ['1','2','3','4','5','6','7','8','9',',','0','del'];
var keys = keyList.map(function (k) {
return { label: k === 'del' ? '⌫' : k, aria: k === 'del' ? 'Effacer' : (k === ',' ? 'Virgule' : k), press: function () { self.press(k); } };
});
return {
display: display,
amountColor: hasAmount ? '#1C1A17' : '#8F877A',
saveLabel: hasAmount ? (rec ? 'Enregistrer · ' + display + ' DT chaque mois' : 'Enregistrer ' + display + ' DT') : 'Saisissez un montant',
title: rec ? 'Nouvelle opération récurrente' : 'Nouvelle dépense',
isOnce: !rec, isRec: rec,
onceChecked: rec ? 'false' : 'true', recChecked: rec ? 'true' : 'false',
onceStyle: segOff + (rec ? '' : segOn), recStyle: segOff + (rec ? segOn : ''),
setOnce: function () { self.setState({ mode: 'once' }); },
setRec: function () { self.setState({ mode: 'recurring' }); },
saveBg: hasAmount ? '#4E6B1F' : '#E7E0D5',
saveFg: hasAmount ? '#FFFFFF' : '#6B6358',
cats: cats, templates: templates, keys: keys
};
}
}
</script>
</body>
</html>
