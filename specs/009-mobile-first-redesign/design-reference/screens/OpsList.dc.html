<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Opérations</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/23d1d29ff2fce2123df00f4c614b0bfe">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#1D4E89}a:hover{color:#163d6c}
</style>
</helmet>
<div class="o-root" style="width: 390px; height: 1100px; position: relative; overflow: hidden; background: #FBF8F3; font-family: Inter, sans-serif; color: #1C1A17">
<dc-import name="TopBar" hint-size="390px,56px"></dc-import>
<div style="padding: 0 16px 112px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; justify-content: space-between; align-items: center">
<button aria-label="Mois précédent" style="width: 44px; height: 44px; border: 0; background: transparent; color: #6B6358; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<span style="text-align: center"><span style="display: block; font-weight: 600">Novembre 2026</span><span class="num" style="font-size: 13px; color: #6B6358">−1 843 DT · +2 800 DT</span></span>
<button aria-label="Mois suivant" disabled style="width: 44px; height: 44px; border: 0; background: transparent; color: #C9C1B4; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>

<label style="position: relative; display: block"><span style="position: absolute; left: 14px; top: 13px; color: #6B6358"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span><input type="search" aria-label="Rechercher une opération" placeholder="Rechercher (nom, note, montant)" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 42px; border: 1px solid #E7E0D5; border-radius: 12px; background: #FFFFFF; font: 400 15px Inter, sans-serif"></label>

<div role="group" aria-label="Filtres" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px">
<button type="button" aria-pressed="true" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #1C1A17; background: #1C1A17; color: #FFFFFF; font: 500 14px Inter, sans-serif">Tout</button>
<button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E7E0D5; background: #FFFFFF; color: #1C1A17; font: 500 14px Inter, sans-serif">Dépenses</button>
<button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E7E0D5; background: #FFFFFF; color: #1C1A17; font: 500 14px Inter, sans-serif">Revenus</button>
<a href="CategoryPicker.dc.html" style="flex: none; min-height: 36px; padding: 0 12px 0 14px; border-radius: 999px; border: 1px solid #E7E0D5; background: #FFFFFF; color: #1C1A17; font: 500 14px Inter, sans-serif; display: flex; align-items: center; gap: 4px; text-decoration: none">Catégorie<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<button type="button" aria-haspopup="menu" style="flex: none; min-height: 36px; padding: 0 12px 0 14px; border-radius: 999px; border: 1px solid #E7E0D5; background: #FFFFFF; color: #1C1A17; font: 500 14px Inter, sans-serif; display: flex; align-items: center; gap: 4px">Membre<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<sc-for list="{{days}}" as="d" hint-placeholder-count="3">
<section aria-label="{{d.label}}">
<div class="num" style="display: flex; justify-content: space-between; padding: 8px 4px 6px; font-size: 13px; color: #6B6358"><span style="font-weight: 600; color: #1C1A17">{{d.label}}</span><span>{{d.total}}</span></div>
<ul class="ui-card" style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{d.rows}}" as="r" hint-placeholder-count="2">
<li style="{{r.border}}"><a href="EditEntry.dc.html" style="min-height: 60px; padding: 8px 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1C1A17">
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 13px; color: #6B6358">{{r.meta}}</span></span>
<span class="num" style="font-weight: 600; white-space: nowrap; color: {{r.color}}">{{r.amount}}</span>
</a></li>
</sc-for>
</ul>
</section>
</sc-for>
</div>
<div style="position: absolute; left: 0; bottom: 0"><dc-import name="TabBar" active="ops" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
function rows(list) {
return list.map(function (r, i) {
return { name: r[0], meta: r[1], amount: r[2], color: r[2].charAt(0) === '+' ? '#2D7A4C' : '#1C1A17', border: i < list.length - 1 ? 'border-bottom: 1px solid #E7E0D5' : '' };
});
}
return { days: [
{ label: "Aujourd'hui", total: '60,350 DT', rows: rows([
['Carrefour Market', 'Supermarché · Sofiane', '48,350 DT'],
['Taxi', 'Transport · Amira', '12,000 DT']]) },
{ label: 'Hier', total: '9,500 DT', rows: rows([
['Café Saf Saf', 'Cafés & resto · Amira', '6,000 DT'],
['Boulangerie', 'Alimentation · Sofiane', '3,500 DT']]) },
{ label: 'Jeudi 19 novembre', total: '+2 800 DT · 85 DT', rows: rows([
['Salaire Sofiane', 'Revenus · récurrente', '+2 800,000 DT'],
['STEG', 'Factures · récurrente · Sofiane', '85,000 DT']]) }
] };
}
}
</script>
</body>
</html>
