<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Budget — mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/23d1d29ff2fce2123df00f4c614b0bfe">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#1D4E89}a:hover{color:#163d6c}
</style>
</helmet>
<div class="o-root" style="width: 390px; height: 1260px; position: relative; overflow: hidden; background: #FBF8F3">
<dc-import name="TopBar" title="Budget" hint-size="390px,56px"></dc-import>
<div style="padding: 0 16px 176px; display: flex; flex-direction: column; gap: 16px">
<nav aria-label="Mois du budget" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px">
<a href="MobBudget.dc.html" style="flex: none; min-width: 64px; min-height: 52px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #E7E0D5; border-radius: 12px; background: #FFFFFF; color: #1C1A17; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 600">sept. <span style="font-weight: 400; font-size: 12px">26</span></span><span style="font-size: 11px; color: #6B6358; display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #8F877A; border: 1px solid #8F877A"></span>Clos</span></a>
<a href="MobBudget.dc.html" style="flex: none; min-width: 64px; min-height: 52px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #E7E0D5; border-radius: 12px; background: #FFFFFF; color: #1C1A17; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 600">oct. <span style="font-weight: 400; font-size: 12px">26</span></span><span style="font-size: 11px; color: #6B6358; display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #8F877A; border: 1px solid #8F877A"></span>Clos</span></a>
<a href="MobBudget.dc.html" aria-current="page" style="flex: none; min-width: 64px; min-height: 52px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #1C1A17; border-radius: 12px; background: #1C1A17; color: #FFFFFF; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 600">nov. <span style="font-weight: 400; font-size: 12px">26</span></span><span style="font-size: 11px; color: #E7E0D5; display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #4E6B1F; border: 1px solid #4E6B1F"></span>En cours</span></a>
<a href="MobBudget.dc.html" style="flex: none; min-width: 64px; min-height: 52px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #E7E0D5; border-radius: 12px; background: #FFFFFF; color: #1C1A17; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 600">déc. <span style="font-weight: 400; font-size: 12px">26</span></span><span style="font-size: 11px; color: #6B6358; display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #1D4E89; border: 1px solid #1D4E89"></span>Prévu</span></a>
<a href="MobBudgetFuture.dc.html" style="flex: none; min-width: 64px; min-height: 52px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #E7E0D5; border-style: dashed; border-radius: 12px; background: #FFFFFF; color: #1C1A17; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 600">janv. <span style="font-weight: 400; font-size: 12px">27</span></span><span style="font-size: 11px; color: #6B6358; display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: transparent; border: 1px solid #6B6358"></span>À faire</span></a>
<a href="MobBudget.dc.html" style="flex: none; min-width: 64px; min-height: 52px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #E7E0D5; border-style: dashed; border-radius: 12px; background: #FFFFFF; color: #1C1A17; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 600">févr. <span style="font-weight: 400; font-size: 12px">27</span></span><span style="font-size: 11px; color: #6B6358; display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: transparent; border: 1px solid #6B6358"></span>À faire</span></a>
</nav>

<section class="ui-card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px" aria-label="Vue d'ensemble">
<div class="num" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div><span class="ui-small ui-muted" style="display: block">Prévu</span><strong style="font-size: 18px; font-weight: 600">2 500</strong></div>
<div><span class="ui-small ui-muted" style="display: block">Dépensé</span><strong style="font-size: 18px; font-weight: 600">1 843</strong></div>
<div><span class="ui-small ui-muted" style="display: block">Reste</span><strong style="font-size: 18px; font-weight: 600; color: #4E6B1F">657 DT</strong></div>
</div>
<div class="ui-progress" role="progressbar" aria-valuenow="74" aria-valuemin="0" aria-valuemax="100" aria-label="Budget utilisé, 74 %"><div class="ui-progress__bar" style="width: 74%"></div></div>
<button type="button" class="ui-button ui-button--secondary" style="min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a1 1 0 0 1 1-1h9"></path></svg>Copier le budget d'octobre</button>
</section>

<button type="button" class="ui-card" style="padding: 14px 16px; display: flex; align-items: center; gap: 12px; border: 1px solid #E7E0D5; text-align: left; font: inherit; color: inherit; min-height: 56px">
<span style="flex: 1"><span style="display: block; font-weight: 500">Revenus attendus</span><span class="ui-small ui-muted">Reçu 2 800 DT</span></span>
<span class="num" style="font-weight: 600">2 800 DT</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19h4L19 9l-4-4L5 15z"></path></svg>
</button>

<section aria-labelledby="h-lines">
<h2 id="h-lines" class="ui-h3" style="margin: 0 4px 8px">Dépenses prévues</h2>
<ul class="ui-card" style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
<li style="{{l.border}}">
<button type="button" aria-label="{{l.aria}}" style="width: 100%; padding: 12px 16px; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 64px; cursor: pointer">
<span class="num" style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%">
<span style="font-weight: 500">{{l.name}}</span>
<span class="ui-row" style="gap: 6px"><span class="ui-small" style="color: {{l.spentColor}}">{{l.spent}} /</span><span style="font-weight: 600">{{l.plan}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19h4L19 9l-4-4L5 15z"></path></svg></span>
</span>
<span class="{{l.barClass}}" style="width: 100%" aria-hidden="true"><span class="ui-progress__bar" style="{{l.barStyle}}"></span></span>
</button>
</li>
</sc-for>
</ul>
</section>

<section class="ui-card" style="padding: 14px 16px; display: flex; align-items: center; gap: 12px" aria-label="Hors budget">
<span style="flex: 1"><span style="display: block; font-weight: 500">Hors budget</span><span class="ui-small ui-muted">21 DT · 2 opérations sans ligne prévue</span></span>
<button type="button" class="ui-button ui-button--ghost" style="min-height: 44px">Ajouter</button>
</section>
</div>

<div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 96px; padding: 10px 10px 10px 16px; border-radius: 14px; background: #1C1A17; color: #FFFFFF; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(28,26,23,0.2)">
<span style="flex: 1; font-size: 14px">1 modification · Alimentation 850 DT</span>
<button type="button" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #FFFFFF; font: 500 14px Inter, sans-serif">Annuler</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: #FFFFFF; color: #1C1A17; font: 600 14px Inter, sans-serif">Enregistrer</button>
</div>

<div style="position: absolute; left: 0; bottom: 0"><dc-import name="TabBar" active="budget" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1260}}'>
class Component extends DCLogic {
renderVals() {
var raw = [
['Alimentation', 712, 850],
['Cafés & resto', 134, 120],
['Transport', 96, 150],
['Factures (STEG, SONEDE, Internet)', 190, 250],
['Loyer', 650, 650],
['Santé', 40, 200],
['Divers', 0, 280]
];
var lines = raw.map(function (r, i) {
var pct = Math.round(r[1] / r[2] * 100);
var over = pct > 100;
var warn = !over && pct >= 85;
return {
name: r[0],
spent: String(r[1]),
plan: r[2] + ' DT',
aria: r[0] + ', prévu ' + r[2] + ' DT, dépensé ' + r[1] + ' DT' + (over ? ', dépassé' : '') + '. Modifier',
spentColor: over ? '#B8443A' : '#6B6358',
barClass: 'ui-progress' + (over ? ' ui-progress--danger' : (warn ? ' ui-progress--warning' : '')),
barStyle: 'width: ' + Math.min(pct, 100) + '%',
border: i < raw.length - 1 ? 'border-bottom: 1px solid #E7E0D5' : ''
};
});
return { lines: lines };
}
}
</script>
</body>
</html>
