<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Opérations récurrentes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/23d1d29ff2fce2123df00f4c614b0bfe">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#1D4E89}a:hover{color:#163d6c}
</style>
</helmet>
<div class="o-root" style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #FBF8F3; font-family: Inter, sans-serif; color: #1C1A17">
<dc-import name="TopBar" title="Récurrentes" hint-size="390px,56px"></dc-import>
<div style="padding: 0 16px 112px; display: flex; flex-direction: column; gap: 16px">

<section class="ui-card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px" aria-label="Chaque mois">
<p style="margin: 0; font-size: 14px; color: #6B6358">En moyenne chaque mois, déjà prévu</p>
<div class="num" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div><span style="display: block; font-size: 13px; color: #6B6358">Dépenses fixes</span><strong style="font-size: 20px; font-weight: 600">773 DT</strong></div>
<div><span style="display: block; font-size: 13px; color: #6B6358">Revenus</span><strong style="font-size: 20px; font-weight: 600; color: #2D7A4C">+2 800 DT</strong></div>
</div>
<a href="MobAddRecurring.dc.html" style="min-height: 48px; border-radius: 12px; background: #4E6B1F; color: #FFFFFF; font: 600 15px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nouvelle opération récurrente</a>
</section>

<section aria-labelledby="r-exp">
<h2 id="r-exp" class="ui-h3" style="margin: 0 4px 8px">Dépenses</h2>
<ul class="ui-card" style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{expenses}}" as="r" hint-placeholder-count="4">
<li style="{{r.border}}"><a href="RuleSheet.dc.html" style="min-height: 64px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1C1A17">
<span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500">{{r.name}}</span><span style="font-size: 13px; color: #6B6358">{{r.every}} · prochaine le {{r.next}}</span></span>
<span class="num" style="font-weight: 600; white-space: nowrap">{{r.amount}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a></li>
</sc-for>
</ul>
</section>

<section aria-labelledby="r-inc">
<h2 id="r-inc" class="ui-h3" style="margin: 0 4px 8px">Revenus</h2>
<ul class="ui-card" style="list-style: none; margin: 0; padding: 0">
<li><a href="RuleSheet.dc.html" style="min-height: 64px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1C1A17">
<span style="flex: 1"><span style="display: block; font-weight: 500">Salaire Sofiane</span><span style="font-size: 13px; color: #6B6358">Chaque mois · prochain le 28 nov.</span></span>
<span class="num" style="font-weight: 600; color: #2D7A4C">+2 800,000 DT</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a></li>
</ul>
</section>

<button type="button" aria-expanded="false" style="min-height: 44px; border: 0; background: transparent; font: 500 14px Inter, sans-serif; color: #1D4E89; display: flex; align-items: center; gap: 6px; padding: 0 4px">Terminées (1)<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<div style="position: absolute; left: 0; bottom: 0"><dc-import name="TabBar" active="rec" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var rows = [
['Loyer', 'Chaque mois', '1er déc.', '650,000 DT'],
['STEG', 'Tous les 2 mois', '12 déc.', '85,000 DT'],
['SONEDE', 'Tous les 3 mois', '5 déc.', '38,400 DT'],
['Internet', 'Chaque mois', '10 déc.', '45,000 DT']
];
return { expenses: rows.map(function (r, i) {
return { name: r[0], every: r[1], next: r[2], amount: r[3], border: i < rows.length - 1 ? 'border-bottom: 1px solid #E7E0D5' : '' };
}) };
}
}
</script>
</body>
</html>
