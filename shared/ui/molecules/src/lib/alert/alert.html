<ui-icon class="ui-alert__icon" [name]="icon()" />
<div class="ui-alert__body">
  @if (title(); as heading) {
    <strong class="ui-alert__title">{{ heading }}</strong>
  }
  <ng-content />
  <div class="ui-alert__actions"><ng-content select="[uiAlertActions]" /></div>
</div>
@if (dismissible()) {
  <button uiButton variant="ghost" size="sm" iconOnly type="button" [attr.aria-label]="text.close" (click)="dismissed.emit()">
    <ui-icon name="x" />
  </button>
}
