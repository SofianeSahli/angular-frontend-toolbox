<a uiButton variant="ghost" size="sm" class="align-self-start" [routerLink]="paths.signIn">
  <ui-icon name="arrow-left" />
  {{ 'identity.common.back' | translate }}
</a>

<h1 class="identity-title">{{ 'identity.forgotPassword.title' | translate }}</h1>
<p class="identity-lead">{{ 'identity.forgotPassword.lead' | translate }}</p>

@if (locked()) {
  <ui-alert tone="danger">{{ 'identity.errors.retryIn' | translate: { seconds: lockedSeconds() } }}</ui-alert>
}

<form class="d-flex flex-column gap-3" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <ui-form-field [label]="'identity.fields.email' | translate" [errors]="serverErrors">
    <input uiInput type="email" autocomplete="email" formControlName="email" [placeholder]="'identity.fields.emailPlaceholder' | translate" />
  </ui-form-field>

  <button uiButton variant="primary" type="submit" [loading]="submitting()" [disabled]="locked()">
    {{ 'identity.forgotPassword.submit' | translate }}
  </button>
</form>
