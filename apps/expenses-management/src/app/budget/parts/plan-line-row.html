<button type="button" class="plan-line plan-line--button" [attr.aria-label]="accessibleName()" (click)="open.emit()">
  <span class="plan-line__head">
    <span class="plan-line__name"><span aria-hidden="true">{{ emoji() }}</span>&ngsp;<bdi>{{ name() }}</bdi></span>
    @if (line().retired) {
      <ui-badge tone="warning">{{ 'budget.retired' | translate }}</ui-badge>
    }
    <bdi class="plan-line__amounts" [class.plan-line__amounts--over]="state() === 'over'">{{ spentText() }} / {{ plannedText() }}</bdi>
  </span>
  <ui-meter [value]="actual()" [max]="answer()?.planned ?? 0" [state]="state()" [label]="name()" />
  @if (lastMonth() !== null) {
    <span class="plan-line__numbers"><bdi>{{ 'budget.lastMonth' | translate: { amount: lastMonthText() } }}</bdi></span>
  }
</button>
@if (error(); as message) {
  <ui-field-message tone="error">{{ message }}</ui-field-message>
}
