<ui-month-switcher variant="plain" [month]="month()" [caption]="caption()" [locale]="locale()" (monthChange)="setMonth($event)" />
<ng-content />
<div class="operations-filters__chips" role="group" [attr.aria-label]="'operations.filters.label' | translate">
  @for (option of typeOptions(); track option.value) {
    <button uiChip type="button" [pressed]="typeChoice() === option.value" (click)="setType(option.value)">{{ option.label }}</button>
  }
  @if (filters().category; as code) {
    <button
      uiChip
      pressed
      type="button"
      [attr.aria-label]="'operations.filters.removeCategory' | translate: { name: categoryName() }"
      (click)="changed.emit({ category: null })"
    >
      <app-category-chip [code]="code" />
      <ui-icon name="x" />
    </button>
  } @else {
    <button uiChip type="button" aria-haspopup="dialog" (click)="pickCategory()">
      {{ 'operations.filters.category' | translate }}
      <ui-icon name="chevron-down" />
    </button>
  }
  @if (showAuthors()) {
    <button uiChip type="button" [pressed]="filters().author !== null" [uiMenuTriggerFor]="authorMenu">
      <span class="visually-hidden">{{ 'operations.filters.author' | translate }} :</span>
      <bdi>{{ authorLabel() }}</bdi>
      <ui-icon name="chevron-down" />
    </button>
    <ng-template #authorMenu>
      <ui-menu>
        <button uiMenuItem [checked]="filters().author === null" (triggered)="changed.emit({ author: null })">
          {{ 'operations.filters.allAuthors' | translate }}
        </button>
        @for (person of authors(); track person.id) {
          <button uiMenuItem [checked]="filters().author === person.id" (triggered)="changed.emit({ author: person.id })">
            <bdi>{{ person.name }}</bdi>
          </button>
        }
      </ui-menu>
    </ng-template>
  }
  @if (narrowed()) {
    <button uiButton variant="ghost" size="sm" type="button" (click)="clear.emit()">
      {{ 'operations.filters.clear' | translate }}
    </button>
  }
</div>
