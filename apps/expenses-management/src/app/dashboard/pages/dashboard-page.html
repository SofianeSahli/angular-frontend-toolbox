<ui-page [title]="'home.title' | translate">
  @if (book()) {
    <ui-month-switcher
      uiPageActions
      variant="plain"
      [month]="month()"
      [min]="minMonth"
      [max]="maxMonth()"
      [locale]="locale()"
      (monthChange)="setMonth($event)"
    />
  }

  @if (book(); as current) {
    @if (store.firstUse() === 'yes') {
      <app-first-use-card (add)="add()" />
    } @else {
      <div class="row g-3">
        @let budgetCard = store.budget();
        @if (budgetCard.status === 'ready' && budgetCard.data; as plan) {
          @if (plan.hasPlan) {
            <app-hero-card class="col-12 col-lg-6" [budget]="plan" [currency]="current.currency" [month]="month()" />
            <app-watch-list-card class="col-12 col-lg-6" [lines]="plan.lines" [currency]="current.currency" [month]="month()" />
          } @else {
            <app-no-plan-card
              class="col-12"
              [comparison]="store.comparison().data"
              [status]="shownStatus(store.comparison().status)"
              [error]="store.comparison().error"
              [currency]="current.currency"
              [month]="month()"
              [position]="position()"
              (retry)="store.reload('comparison')"
            />
          }
        } @else {
          <app-card-frame
            class="col-12"
            [heading]="'dashboard.hero.title' | translate"
            [status]="shownStatus(budgetCard.status)"
            [error]="budgetCard.error"
            (retry)="store.reload('budget')"
          />
        }

        <app-pace-card
          class="col-12"
          [summary]="store.summary().data"
          [previous]="store.previous().data"
          [budget]="store.budget().data"
          [month]="month()"
          [today]="today()"
          [currency]="current.currency"
          [status]="shownStatus(store.summary().status)"
          [error]="store.summary().error"
          (retry)="store.reload('summary')"
        />

        <app-categories-card
          class="col-12 col-lg-6"
          [summary]="store.summary().data"
          [status]="shownStatus(store.summary().status)"
          [error]="store.summary().error"
          [currency]="current.currency"
          [month]="month()"
          (retry)="store.reload('summary')"
        />

        @if (showMembers()) {
          <app-members-card
            class="col-12 col-lg-6"
            [summary]="store.summary().data"
            [status]="shownStatus(store.summary().status)"
            [error]="store.summary().error"
            [currency]="current.currency"
            (retry)="store.reload('summary')"
          />
        }

        <app-trend-card
          class="col-12"
          [summary]="store.trend().data"
          [month]="month()"
          [currency]="current.currency"
          [status]="shownStatus(store.trend().status)"
          [error]="store.trend().error"
          (retry)="store.reload('trend')"
        />

        <app-upcoming-card
          class="col-12 col-lg-6"
          [rules]="store.upcoming().data ?? []"
          [status]="shownStatus(store.upcoming().status)"
          [error]="store.upcoming().error"
          [today]="today()"
          [month]="month()"
          [currency]="current.currency"
          (retry)="store.reload('upcoming')"
        />

        <app-recent-card
          class="col-12 col-lg-6"
          [entries]="store.recent().data ?? []"
          [status]="shownStatus(store.recent().status)"
          [error]="store.recent().error"
          [currency]="current.currency"
          [month]="month()"
          [today]="today()"
          (retry)="store.reload('recent')"
          (open)="edit($event)"
        />
      </div>
    }
  } @else {
    <div class="row g-3">
      <app-card-frame class="col-12 col-lg-6" [heading]="'dashboard.hero.title' | translate" status="loading" />
      <app-card-frame class="col-12 col-lg-6" [heading]="'dashboard.watch.title' | translate" status="loading" />
      <app-card-frame class="col-12" [heading]="'dashboard.pace.title' | translate" status="loading" />
    </div>
  }
</ui-page>
