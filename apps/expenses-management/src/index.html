<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Gestion des dépenses</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- spec 002, REQ-2.6: Inter and IBM Plex Sans Arabic, text visible at once in the fallback font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    />
    <!-- spec 002, US-5: apply the saved or device theme before the first paint (UiThemeService takes over). -->
    <script>
      (function () {
        var choice = 'system';
        try {
          var saved = localStorage.getItem('ui.theme');
          if (saved === 'light' || saved === 'dark') choice = saved;
        } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
